[The SCP Foundation]
image path = foundationlogo.jpg
align x = left
align y = top
text1 = SCP재단은 변칙적인 유물과 생명체를 격리하고 연구하는 데 전념하는 단체입니다.
text2 = "SCP"는 "Special Containment Procedures(특수 격리 절차)"를 의미하는 동시에 재단의 공식 표어인 "Secure, Contain, Protect.(확보, 격리, 보호.)"이기도 합니다. - 이는 재단의 활동 목표와 방법을 모두 함축하고 있습니다.

