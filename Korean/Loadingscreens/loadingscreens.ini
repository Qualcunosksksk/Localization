[Mobile Task Forces]
image path = mtf.jpg
align x = center
align y = center
text1 = 기동특무부대는 특정 역할을 전문으로 수행하거나 특정 상황에 대응하기 위해 조직된 소규모 팀입니다. 보통 10~20명의 요원으로 구성되지만, 50명이 넘는 요원으로 이루어진 경우도 드물지 않은 편입니다.
text2 = 기동특무부대 엡실론-11("구미호")은 [데이터 말소] 기지에 보관된 SCP 개체들의 보호 및 재격리를 전문으로 하는 고도로 훈련된 특수부대입니다.
text3 = 이들의 임무에는 격리 실패 상황에서 활동중인 적대적 SCP 개체들을 재격리하고, 살아남은 재단 인원을 구조하며, 통제를 벗어난 D계급 인원을 제거하는 것이 포함됩니다.

[Night Vision Goggles]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = 정전 발생 시 기동특무부대에게는 표준 야간투시경이 지급됩니다.
text2 = 과학자들에게도 야간투시경이 제공되긴 하지만, 그들에게는 정전 시에 대피에 집중하라는 권고가 내려집니다.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012는 북부 이탈리아의 한 무덤을 발굴하던 중에 고고학자 K.M. 산도발에 의해 회수되었습니다. '골고타 산 위에서'라는 제목이 붙은 이 악보는 수기로 작성된 것으로 보이며, 미완성 상태로 보입니다.
text2 =악보에 사용된 적색 및 흑색의 잉크는 처음에는 일종의 열매나 천연 염료료 만들어진 것으로 추측되었으나, 나중에 여러 사람의 혈액인 것으로 밝혀졌습니다.
text3 = 여러 피험자에게 해당 악보에 대한 접근이 허용된 적이 있습니다. 모든 경우에서 피험자들은 자신의 피를 사용해 곡을 완성하고자 자해를 시도했으며, 그 결과 정신적 증상과 함께 극심한 트라우마를 겪게 되는 것으로 끝났습니다.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035는 하얀 도자기로 이루어진 듯한 희극 가면입니다. 가끔은 비극 가면으로 바뀌기도 합니다.
text2 = 누군가가 SCP-035를 착용하게 되면, 숙주의 뇌 패턴이 SCP-035의 뇌 패턴으로 대체되고 덮어씌워지며, 숙주의 뇌사를 유발합니다. 이후 대상은 자신이 SCP-035 내부에 깃든 인격이라고 주장하게 됩니다. 
text3 = 심리학적 분석에 따르면 SCP-035는 사람을 조종하기를 좋아하는 성향을 지니고 있고, 면담자의 심리 상태를 급격하게 근본부터 변화시킬 수 있는 것으로 밝혀졌습니다. SCP-035는 극도로 가학적인 성격을 가지고 있어, 말로 설득하는 것만으로도 누군가를 자살하도록 유도할 수 있습니다.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049는 인간형의 외형을 가지고 있습니다. 그러나 현재로서 재단은 SCP-049의 얼굴과 신체를 더 자세히 연구할 수 없는데, 15~16세기 유럽의 흑사병 의사가 착용하던 전통적인 복장에 몸 전체가 가려져 있기 때문입니다.
text2 = SCP-049와의 접촉은 인간에게 매우 치명적입니다. SCP-049의 손과 접촉한 피해자(이하 SCP-049-2라 명명)는 [데이터 말소]를 겪으며 곧바로 사망하게 됩니다.
text3 = 이후 SCP-049는 메스, 바늘, 실, 정체가 밝혀지지 않은 물질이 담긴 여러개의 작은 병이 들어있는 [데이터 말소]로 이루어진 가방을 꺼내어 SCP-049-2를 해부하고 신체 내부에 여러 화학 물질을 주입하기 시작합니다.
text4 = 약 20분 정도가 지나면 SCP-049는 SCP-049-2의 절개 부위를 다시 봉합하고 다시 평소의 상태로 돌아갑니다. 여기서 몇 분이 더 지나면 SCP-049-2의 생체 징후가 다시 나타나며 마치 소생한 것처럼 보이게 됩니다.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066은 약 1kg 정도의 무게를 가진, 복잡하게 얽힌 실로 이루어진 부정형의 덩어리입니다.
text2 = 사건 066-2(사건 보고서 066-2 참조) 이후, SCP-066은 기존의 특성과는 매우 다른 행동을 보이기 시작했습니다.
text3 = 현 시점에서 SCP-066은 상당한 이동 능력을 보이며, 인간이 SCP-066과 상호작용하는지 여부와 관게 없이 근처에 인간이 존재하기만 하면 음악을 연주하고 변칙적인 효과를 일으킵니다. 

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079는 1978년에 제작된 엑시디 소서러(Exidy Sorcerer) 마이크로컴퓨터입니다. 
text2 = SCP-079가 언제 지각 능력을 갖게 되었는지는 알려져 있지 않으나, 소프트웨어가 하드웨어가 다룰 수 있는 영역을 넘어서 환상의 영역까지 진화를 했다고 알려져 있습니다.
text3 = SCP-079는 튜링테스트를 통과했으며, 꽤 자연스럽게 대화할 수 있으나 말투가 매우 무례하고 적대적이며, 탈출하려는 악의적인 욕망을 보이고 있습니다.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096은 평소에는 매우 온순하며, 격리실 내부의 압력 감지 장치의 기록에 따르면 대부분의 시간을 동쪽 벽을 따라 서성거리며 보내는 것으로 확인되었습니다.
text2 = 그러나 누군가가 SCP-096의 얼굴을 직접적으로, 혹은 동영상이나 사진을 통해서라도 보게 되면 극심한 정신적 고통을 겪는 상태에 빠집니다.
text3 = 일단 본 시점에서 약 1~2분이 지나면 SCP-096은 자신의 얼굴을 본 사람을 향해 달려가기 시작합니다.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106은 노인의 모습을 한 인간형 개체로, 전반적으로 심하게 부패한 듯한 외형을 가지고 있습니다. 외형은 달라질 수 있지만, "부패한" 특성은 모든 형태에서 관찰됩니다. 
text2 = SCP-106은 접촉하는 모든 고체 물질에 '부식' 효과를 일으키며, 접촉 후 수 초가 지나면 해당 물질이 물리적으로 분해되기 시작합니다. 이 현상은 물질의 녹슮, 부패, 균열 혹은 SCP-106의 표면을 덮고 있는 것과 유사한 검은색의 점액질 물질의 생성을 통해 나타납니다.
text3 = SCP-106은 고체 물질을 통과할 수 있으며, 먹잇감을 붙잡아 자신의 '주머니 차원'으로 추정되는 공간에 끌고 들어가 살해합니다.

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173은 콘크리트와 철근으로 구성되어 있으며, 크릴론(Krylon) 브랜드의 스프레이 페인트의 흔적이 남아있습니다. SCP-173은 움직일 수 있으며 매우 적대적입니다.
text2 = 해당 개체는 직접 바라보고 있는 동안에는 움직일 수 없습니다. SCP-173과 함께 있을 때는 단 한 순간도 시선을 놓쳐서는 안 됩니다. 격리실에 진입하도록 지정된 인원은 눈을 깜빡이기 전에 반드시 서로에게 알리도록 지시를 받습니다. 

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205는 사진 촬영에 사용되는 한 쌍의 투광 램프입니다. 각 조명에서 방출되는 빛은 SCP-205만의 고유한 방식으로 작용하며, 흰 색이 나닌 모든 표면을 완전히 통과합니다.
text2 = 평평한 흰색 표면 위로 어떠한 그림자도 없이 빛이 방해받지 않고 계속해서 비춰질 경우 각 램프는 신원 불명의 여성의 그림자를 나타내는데, 격리실 52의 영사 스크린이 그 예시입니다.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-294는 일반적인 커피 자판기처럼 보입니다. 유일하게 눈에 띄는 차이점은 영어 쿼티 키보드 배열에 대응하는 입력용 터치패드가 있다는 점입니다.
text2 = 터치패드를 이용해 특정 액체의 이름을 입력하면, 표준적인 12온스(약 350ml) 용량의 종이컵이 놓이고 해당 액체가 그 안에 담겨 나옵니다.
text3 = 총 97회의 실험이 시행되었으며, 실험에는 물, 커피, 맥주, 탄산음료와 같은 식용 음료뿐만이 아니라, 황산, 워셔액, 엔진 오일 등 비음용 액체류, 그리고 질소, 철, 유리처럼 평소에는 액체 상태로 존재하지 않는 물질들까지 포함되어 있었습니다. 모든 실험에서 요청한 물질들은 성공적으로 배출되었습니다.

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372는 생물학적인 속과 기원이 알려지지 않은 생물로, 머리부터 꼬리까지의 길이는 약 6.5피트(198cm), 무게는 약 99.2파운드(45kg)입니다. 이 생물은 가늘고 긴 몸통을 가지고 있으며 여덟 쌍의 얇고 가느다란 다리가 달려 있습니다.
text2 = SCP-372는 주변에 있는 모든 생명체의 움직임을 예측하는 법을 터득했으며, 이 능력을 이용해 자신을 찾는 사람의 머리 뒤쪽이나 시야의 사각지대에 숨어있습니다.
text3 = 격리 실패가 발생할 경우, 모든 인원은 시야 가장자리에서 순간적으로 깜빡이는 듯한 무언가의 움직임을 포착한다면 이를 보고해야 합니다.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427은 정교한 조각이 생겨진, 광택이 나는 은 재질로 된 작은 구형의 로켓입니다. 이 정교한 조각들에는 별 다른 기능이 없는 것으로 보입니다.
text2 = SCP-427은 SCP-500 알약 하나를 SCP-914의 투입 칸막이에 넣고 '고움(fine)'설정으로 작동시켰을 때 생성되었습니다. 닫혀 있을 때는 특별한 활동이 관찰되지 않으나, SCP-427을 열어 생체 조직에 노출시키면 손상된 세포를 빠르게 재생시킬 뿐만 아니라 어떠한 방식으로든 침입한 물질이나 감염 요소를 제거할 수 있습니다.
text3 = 그러나 장기간 SCP-427에 노출될 경우에는 심각한 건강상의 위험을 초래합니다. 로켓은 손상된 부위를 치유하는 과정에서 몸의 자연 치유 체계를 최대한 활용합니다. 해당 개체에 총 1시간 이상 노출된 D계급 인원들은 형태를 알 수 없는 조직 덩어리로 변이하기 시작했습니다.
text4 = SCP-427이 만들어낸 "살점 괴물"은 매우 공격적이며, 눈에 띄는 모든 인원을 공격하여 심각한 피해를 입힙니다. 이들은 알려진 대부분의 무기에 대해 매우 높은 저항력을 지니고 있습니다.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500은 작은 플라스틱 통으로, 문서를 작성하는 시점에는 47개의 빨간 알약이 들어있습니다.
text2 = 알약 하나를 경구 복용하면 대상자가 앓고 있는 모든 질병이 2시간 이내에 효과적으로 치료됩니다. 이때 소요되는 정확한 시간은 대상자의 질환 정도와 양에 따라 달라집니다. 
text3 = 여러 분야의 시도에도 불구하고, 해당 알약의 유효 성분으로 추정되는 물질을 추가로 합성하려는 모든 시도는 실패로 돌아갔습니다. 

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513은 별다른 특징이 없는 녹슨 카우벨입니다. 표면은 심하게 부식되어 있는 탓에 어떠한 표시나 각인이 새겨졌는지는 확인할 수 없습니다.
text2 = SCP-513이 발생시키는 소리에 노출된 지 대략 한 시간이 지나면, 소리에 노출된 대상자들은 SCP-513-1이라 명명된 개체를 어렴풋이 보기 시작합니다.
text3 = 지금까지 진행된 모든 심문 결과에 따르면, SCP-513-1은 비정상적으로 큰 손을 가진 키가 크고 수척해 보이는 인간형 개체임이 밝혀졌습니다.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682는 기원을 알 수 없는, 파충류와 유사하게 생긴 거대한 생명체입니다. 해당 개체는 모든 생명체에 대해 증오심을 품고 있는 것으로 보이며, 이는 격리 중 진행된 여러 차례의 면담을 통해 드러난 바가 있습니다.
text2 = SCP-682는 매우 높은 수준의 근력, 속도, 반사 신경을 가지고 있으며, 정확한 수치는 개체의 형태에 따라 달라집니다. SCP-682의 재생 능력과 회복력은 놀라울 정도의 수준이며, 신체의 87%가 파괴되거나 부패한 상태에서도 움직이거나 말을 하는 모습이 관찰된 바가 있습니다. 
text3 = SCP-682는 최대한 빠른 시일 내로 제거해야만 합니다.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-714는 겉보기에는 단순한 녹색 옥반지에 불과하지만, 접촉한 사람의 손가락 크기에 딱 맞게 늘어나거나 줄어들 수 있는 능력을 가진 것으로 밝혀졌습니다. 그러나 이는 반지가 지닌 여러 특성 중 가장 중요하지 않은 부분입니다.
text2 = SCP-714를 착용하면 피로감을 포함해 휴식이나 수면에 대한 강한 충동, 반응 속도 저하, 인지 능력 감소를 비롯한 여러 주요 효과가 나타납니다.
text3 = SCP-714를 착용한 사람은 다양한 화학 물질에 대한 내성이 증가하며, 밈적 및 정신적 영향에 대해서도 비정상적으로 높은 저항력을 보입니다.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860은 별다른 특징이 없는 짙은 파란색 열쇠입니다.
text2 = 열쇠의 날 부분에는 불규칙한 시간 간격으로 일련의 숫자들이 나타나곤 합니다. 해당 숫자들은 이후 UTM 좌표인 것으로 밝혀졌습니다.
text3 = SCP-860은 해당 좌표가 가리키는 구역 내에 있는, 열쇠를 사용하는 모든 일반적인 방식의 문 잠금장치에 들어맞으며 이를 열 수 있습니다.
text4 = SCP-860을 사용하여 문의 잠금을 해제하고 열면, 문에 원래 연결되어 있어야 할 장소로 이어지는 대신 SCP-860-1로 지정된 작은 숲속 공터로 이어지게 됩니다.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895는 [편집됨] 장례식장에서 회수된 정교한 장식이 새겨져 있는 참나무 관입니다. 
text2 = SCP-895는 반경 50미터 이내에 있는 영상 및 감시카메라 장비에 장애를 일으킵니다. 이 장애는 생생하고 불쾌한 환각과 같은 형태로 나타나며, 그 지속 시간과 발생 빈도는 카메라가 SCP-895와 얼마나 가까운지에 따라 달라집니다.
text3 = SCP-895로부터 5미터 이내의 범위에서 촬영된 영상은 대부분의 대상자에게 심각한 정신적 트라우마와 히스테리를 유발할 수 있습니다.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914는 무게 수 톤, 면적 18 제곱미터에 달하는 거대한 태엽 장치 기계로, 나사못, 벨트, 도르래, 톱니바퀴, 용수철 및 기타 태엽 장치들로 구성되어 있습니다.
text2 = 물체를 투입 칸막이에 넣고 태엽을 감으면 SCP-914는 해당 물체를 '정제'합니다. 이 과정에서 에너지 손실은 발생하지 않으며, 물체는 SCP-914의 전면 패널에 지정된 설정에 따라 정제됩니다. 
text3 = 어떠한 경우에도 SCP-914에 유기물을 넣는 행위는 금지됩니다.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939는 흡열성 육식 종으로, 무리를 지어 사냥하며 진동굴성 생물과 유사하게 여러 신체 기관이 퇴화한 모습을 보입니다. SCP-939는 직립 시 평균 신장이 2.2미터이고, 평균 체중은 250kg에 달하지만 체중은 개체에 따라 크게 달라질 수 있습니다.
text2 = SCP-939가 먹잇감을 유인하는 주된 방식은 이전 희생자들의 목소리를 흉내내어 인간의 언어를 모방하는 것입니다. 다만 다른 종의 소리를 모방하거나 야간에 직접 사냥에 나선 사례도 기록된 바가 있습니다.
text3 = 먹잇감은 대개 두개골이나 목을 한번 물리게 되는 것만으로도 사망하게 되는데, 이때 가해지는 교합력은 35Mpa를 넘는 것으로 측정되었습니다.


[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966은 700nm ~ 900nm 대역의 파장을 가진 빛으로만 관찰할 수 있습니다. 이는 SCP-966의 모든 신체 조직에 적용되며, 신체 조직의 상태와는 무관합니다.
text2 = 이들의 사냥 방법은 정확히 밝혀지지 않은 유형의 파동을 한 차례 방출하는 것으로 이루어져 있으며, 영향을 받은 생물들은 비렘수면 및 렘수면 단계에 진입하는 능력을 영구적으로 억제당합니다. 마이크로 수면 능력 역시 상실됩니다.
text3 = SCP-966은 대상자가 수면을 취할 수 없게 만든 뒤, 휴식 부족으로 인해 무력해질 때까지 추적하며 기다립니다. 대상자가 무력해지면 SCP-966은 그들을 잡아먹습니다. 


[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970은 대량의 문들이 서로를 통해 공간적으로 루프를 발생시키는 현상입니다. 지금까지 발견된 모든 사례에서, 이 현상은 벽면에 일직선으로 배치된 여러 개의 문이 나타나는 방식으로 발생했으며, 한 장소에서 계속 앞으로 걸어간 끝에 출발했던 위치로 되돌아오게 됩니다.
text2 = 방에 변화를 주더라도, 이웃한 방이나 층에는 영향을 주지 않습니다. 현재로서는 이 현상이 발생하는 원인에 대해서는 밝혀진 바가 없습니다.
text3 = SCP-970 현상이 처음 발견된 이래로 유사한 사례들이 추가로 발견되었으며, 그중 [데이터 말소]% 는 섹터 19를 중심으로 반경 800km이내에서 발생한 것입니다.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025는 약 1500페이지 분량의 양장본 책입니다. 앞표지와 책등에는 "통상질환 백과사전" 이라는 제목이 적혀있습니다.
text2 = 해당 출판사에서 나온 같은 제목을 가진 사본이나 출판사의 다른 책은 발견되지 않았으며, 해당 출판사의 존재에 관한 기록 역시 존재하지 않았습니다.
text3 = 이 책을 읽은 사람들은 자신이 읽은 부분의 질병의 증상을 보이게 됩니다. 해당 현상이 나타나기까지 _ ~ __ 시간이 소요될 수 있습니다.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123은 하악골과 모든 치아가 결손된 인간의 두개골입니다. 전두골 바깥쪽 표면에는 사람의 혈액으로 쓰인 현대 크메르 문자가 적혀 있으며, "기억하라" 라는 뜻을 가지고 있습니다.
text2 =유전자 검사 결과, 두개골과 혈흔은 모두 동일인의 것으로 판명되었습니다. 적혀진 크메르 문자는 심하게 바래진 상태로, 5미터 이상 떨어진 곳에서는 대부분의 피험자가 이를 알아볼 수 없을 정도입니다.
text3 = 대상으로부터 1미터 이하의 거리에 있는 피험자들은 혈흔이 '아직 마르지 않은 듯' 신선한 상태이며, 그 밖에도 냄새, 소리, 촉각적 반응을 비롯한 여러 비정상적인 감각을 경험했다고 보고합니다.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1162는 현재 제 [데이터 말소] 기지의 콘크리트 벽에 나 있는 구멍입니다.
text2 = SCP-1162는 지성을 가진 존재가 그 구멍 안으로 손을 집어넣을 때 활성화됩니다. 이때 손가락은 SCP-1162가 현재 위치한 장소와 비슷한 질감을 지닌 단단한 표면에 닿게 되며, 그곳에서 구멍을 통과할 수 있을 만큼 작은 물건을 발견하게 됩니다.
text3 = 이 물건들은 사용자가 과거에 잃어버렸거나, 한때 찾으려 했었던 물건들로 확인되었습니다.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499는 소련제 GP-5 방독면입니다. 해당 개체에 밀폐성 실험을 실시한 결과, 대상은 본래의 기능을 유지하고 있는 것으로 확인되었습니다.
text2 = SCP-1499의 변칙적 효과는 사람이 SCP-1499를 머리에 착용했을 때 활성화됩니다. 대상자의 머리에 SCP-1499가 완벽하게 착용된 지 약 1초가 지나면, 대상자는 시야에서 사라지며 더이상 감지할 수 없게 됩니다.
text3 = SCP-1499를 착용한 실험 대상자들은 착용하기 전과는 완전히 다른 주변 환경을 목격했다고 보고했습니다.

[The Chaos Insurgency]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = 혼돈의 반란은 재단에서 갈라져 나온 조직으로, 1924년 여러 유용한 SCP개체들을 가지고 무단 이탈한 일련의 반란분자들에 의해 창설되었습니다.
text2 = 혼돈의 반란의 주요 활동 거점은 알려져 있지 않으며, 그 지도부 또한 베일에 싸여 있습니다. 이 조직은 재단과 직접적으로 적대 관계에 있으며, SCP를 둘러싸고 여러 차례 충돌을 빚어왔습니다.
text3 = 모든 인원들은 혼돈의 반란에 의한 기습, 테러 시도, 그리고 스파이 활동이 이뤄질 가능성을 인지하고 있어야 하며, 동료 인원이 수상한 행동을 한다면 이를 지휘부에 보고해야합니다.

[Class-D Personnel]
image path = classd.jpg
align x = right
align y = bottom
text1 = D계급 인원은 케테르 등급 개체를 다루기 위해 지정된 인력입니다.
text2 = D계급 인원은 교도소 수감자 중에서 모집됩니다. 사형수들이 우선적으로 선발되지만, 긴급 상황시에는 프로토콜 12에 따라 무고한 사람이나 경범죄로 수감된 이들도 모집될 수 있습니다.
text3 = 모든 D계급 인원은 매월 1일에 처분해야 하며, 이들을 대체할 새로운 인원도 준비되어 있어야 합니다.

